name: Publish interface index

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble static site
        run: |
          mkdir -p site-build
          cp index.html app.js catalog.js styles.css site-build/

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site-build

      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
